<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemmaclaw</title>
  <style>
    :root { --bg: #0d1117; --fg: #e6edf3; --accent: #4285f4; --muted: #8b949e; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    .hero { text-align: center; max-width: 640px; }
    h1 { font-size: 3rem; font-weight: 700; margin-bottom: 1rem; }
    h1 span { color: var(--accent); }
    .tagline { font-size: 1.25rem; color: var(--muted); margin-bottom: 2rem; line-height: 1.6; }
    .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .links a { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: opacity 0.15s; }
    .links a:hover { opacity: 0.85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { border: 1px solid var(--muted); color: var(--fg); }
    footer { margin-top: 3rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="hero">
    <h1><span>Gemma</span>claw</h1>
    <p class="tagline">Out-of-the-box best Gemma setup for your hardware. Auto-selects backend, model size, quantization, and runtime settings so you can focus on building.</p>
    <div class="links">
      <a class="btn-primary" href="https://github.com/gemmaclaw/gemmaclaw">GitHub Repository</a>
      <a class="btn-secondary" href="https://github.com/gemmaclaw/gemmaclaw#readme">Documentation</a>
    </div>
  </div>
  <footer>Gemmaclaw Project</footer>
</body>
</html>
