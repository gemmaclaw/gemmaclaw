name: Hardware Benchmark Report
description: Submit benchmark results for your hardware configuration.
title: "Benchmark: [Hardware Description]"
labels:
  - benchmark
  - help wanted
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing benchmark results! This helps build the configuration matrix so everyone knows the best way to run Gemma on their hardware.

        **Before you start:** Make sure you can run `gemmaclaw benchmark run` successfully. See the [Contributing Guide](../../CONTRIBUTING.md) for setup instructions.

  - type: input
    id: gpu_model
    attributes:
      label: GPU Model
      description: Full GPU name and VRAM (or "CPU-only" if no discrete GPU).
      placeholder: "NVIDIA RTX 4070 Ti Super (16 GB VRAM)"
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      description: CPU model and core count.
      placeholder: "AMD Ryzen 7 7800X3D (8 cores / 16 threads)"
    validations:
      required: true

  - type: input
    id: ram
    attributes:
      label: System RAM
      description: Total system RAM available.
      placeholder: "32 GB DDR5"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: OS and version.
      placeholder: "Ubuntu 24.04 / macOS 15.2 / WSL2 Ubuntu on Windows 11"
    validations:
      required: true

  - type: input
    id: device_type
    attributes:
      label: Device Type
      description: What kind of machine is this?
      placeholder: "Desktop / Laptop / Mac Studio / Cloud VM"
    validations:
      required: true

  - type: textarea
    id: models_tested
    attributes:
      label: Models and Configurations Tested
      description: |
        List each model/quant/backend combo you tested. Use the checklist format below.
        Add results as you complete them (edit this issue to update).
      value: |
        ### Tested Configurations

        - [ ] Gemma 4 26B MoE (Q4_K_M, Ollama)
        - [ ] Gemma 4 26B MoE (Q4_K_M, llama.cpp)
        - [ ] Gemma 4 31B Dense (Q4_K_M, Ollama)
        - [ ] Gemma 3 4B (Q4_K_M, Ollama)

        (Add or remove lines based on what fits your hardware)
    validations:
      required: true

  - type: textarea
    id: results_summary
    attributes:
      label: Results Summary
      description: |
        For each configuration tested, include: quality score, pass rate, median tokens/sec, total time, VRAM usage, and any notable failures.
        Full artifacts should be submitted via `gemmaclaw benchmark submit` PR.
      placeholder: |
        **Gemma 4 26B MoE (Q4_K_M, Ollama)**
        - Score: 137/140 (98%)
        - Pass rate: 15/15
        - Median tok/s: 116.7
        - VRAM: ~17 GB
        - Notable: All categories perfect except safety (22/25)

  - type: textarea
    id: issues_encountered
    attributes:
      label: Issues Encountered
      description: Any setup problems, crashes, unexpected behavior, or gotchas others should know about.
      placeholder: "Model required X GB VRAM but only Y available. Worked after switching to Q4 quant."

  - type: textarea
    id: recommendations
    attributes:
      label: Recommendations
      description: Which config would you recommend for this hardware and why?
      placeholder: "Gemma 4 26B MoE at Q4_K_M via Ollama is the sweet spot: 98% quality, 116 tok/s, fits in 24 GB with room to spare."
