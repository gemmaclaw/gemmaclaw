name: Gemmaclaw npm Release

on:
  workflow_dispatch:
    inputs:
      publish_existing_tag:
        description: Existing release tag to publish to npm, for retrying a release after the GitHub release/tag already exists
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: gemmaclaw-npm-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.x"
  PNPM_VERSION: "10.33.0"

jobs:
  release-please:
    name: Prepare or publish release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Validate release-please token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error::Configure the RELEASE_PLEASE_TOKEN repository secret with contents:write and pull_requests:write. The gemmaclaw organization blocks GITHUB_TOKEN from creating release PRs."
            exit 1
          fi

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_existing_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          RELEASE_PLEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          MANUAL_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_existing_tag || '' }}
        run: |
          set -euo pipefail
          release_tag="${MANUAL_TAG:-$RELEASE_PLEASE_TAG}"
          if [[ ! "$release_tag" =~ ^gemmaclaw-v[0-9]{4}\.[1-9][0-9]*\.[1-9][0-9]*((-beta\.[1-9][0-9]*)|(-[1-9][0-9]*))?$ ]]; then
            echo "Invalid Gemmaclaw release tag: ${release_tag}" >&2
            exit 1
          fi
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release-tag.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Ensure version is not already published
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if npm view "gemmaclaw@${package_version}" version >/dev/null 2>&1; then
            echo "gemmaclaw@${package_version} is already published on npm." >&2
            exit 1
          fi
          echo "Publishing gemmaclaw@${package_version}"

      - name: Publish package
        run: npm publish --access public --provenance
